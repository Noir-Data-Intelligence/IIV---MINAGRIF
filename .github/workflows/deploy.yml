name: "Deploy VPS Noir IIV"

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Executar deploy via SSH
        uses: appleboy/ssh-action@v1.2.0

        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.PORT }}

          script: |
            cd /opt/projects/IIV---MINAGRIF

            git pull origin master

            docker compose -f docker-compose.production.yml down

            docker compose -f docker-compose.production.yml up -d --build

            docker image prune -f

            echo "=== DIAGNOSTICO TEMPORARIO (ver iiv.noirdataintelligence.com a servir Laravel em vez do React) ==="
            echo "--- docker ps -a (todos os containers, todas as redes) ---"
            docker ps -a || true
            echo "--- inspect iiv-web: redes e labels traefik ---"
            docker inspect iiv-web --format '{{json .NetworkSettings.Networks}}' || true
            docker inspect iiv-web --format '{{json .Config.Labels}}' || true
            echo "--- containers com 'traefik' no nome ou labels traefik.enable ---"
            docker ps -a --format '{{.Names}}' | xargs -I{} sh -c 'docker inspect {} --format "{{.Name}} traefik.enable={{index .Config.Labels \"traefik.enable\"}}" 2>/dev/null' || true
            echo "--- curl local directo ao container iiv-web pela rede proxy ---"
            docker run --rm --network proxy curlimages/curl:latest -s -o /dev/null -w 'iiv-web directo: %{http_code}\n' http://iiv-web:80/login || true
            echo "--- curl com Host header forcado a localhost (apanha o proxy de entrada, seja ele qual for) ---"
            curl -s -o /dev/null -w 'localhost:80 Host=iiv: %{http_code}\n' -H 'Host: iiv.noirdataintelligence.com' http://127.0.0.1:80/login || true
            curl -s -o /dev/null -w 'localhost:443 Host=iiv (-k): %{http_code}\n' -k -H 'Host: iiv.noirdataintelligence.com' https://127.0.0.1:443/login || true
            echo "--- montagens do container 'nginx' (onde vive a config real) ---"
            docker inspect nginx --format '{{json .Mounts}}' || true
            echo "--- ficheiros de config dentro do container nginx ---"
            docker exec nginx sh -c "ls -la /etc/nginx/ /etc/nginx/conf.d/ /etc/nginx/sites-enabled/ /etc/nginx/http.d/ 2>/dev/null" || true
            echo "--- grep por 'iiv' dentro da config do container nginx ---"
            docker exec nginx sh -c "grep -rl iiv /etc/nginx/ 2>/dev/null" || true
            echo "--- conteudo completo de qualquer ficheiro de config que mencione iiv ---"
            docker exec nginx sh -c "grep -rl iiv /etc/nginx/ 2>/dev/null | xargs -I{} sh -c 'echo FICHEIRO: {}; cat {}'" || true
            echo "--- default_server actual (quem apanha pedidos sem match) ---"
            docker exec nginx sh -c "grep -rln default_server /etc/nginx/ 2>/dev/null | xargs -I{} sh -c 'echo FICHEIRO: {}; cat {}'" || true
            echo "=== FIM DIAGNOSTICO ==="
