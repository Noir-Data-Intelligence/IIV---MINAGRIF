name: "Deploy VPS Noir IIV"

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Executar deploy via SSH
        uses: appleboy/ssh-action@v1.2.0

        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.PORT }}

          script: |
            cd /opt/projects/IIV---MINAGRIF

            git pull origin master

            docker compose -f docker-compose.production.yml down

            docker compose -f docker-compose.production.yml up -d --build

            docker image prune -f

            echo ""
            echo "🔁 Restarting nginx (reverse-proxy partilhado do VPS)..."
            echo "O 'proxy_pass http://iiv-web:80' em iiv-web.conf nao tem 'resolver' -"
            echo "o IP do iiv-web e resolvido uma unica vez e fica em cache. Como este"
            echo "container e sempre recriado (down + up --build), reiniciar o nginx"
            echo "partilhado a seguir evita que a cache fique desactualizada (ja"
            echo "aconteceu: todas as rotas do admin a devolver 404 do Laravel, por o"
            echo "nginx reencaminhar para o container errado)."

            docker restart nginx
