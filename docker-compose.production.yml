services:
  web:
    container_name: iiv-web
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SITE_URL: ${VITE_SITE_URL:-https://www.iiv.gov.ao}
        # Backend real (ver Back-end/docker-compose.production.yml) já existe
        # e está dockerizado — por omissão liga-se a ele, não ao mock.
        VITE_API_MOCK: ${VITE_API_MOCK:-false}
        # Backend deployado no seu próprio subdomínio (não no mesmo host via
        # Traefik path-based, como o plano original de 2026-08-09 previa) —
        # por isso URL absoluto aqui. SESSION_DOMAIN do backend fica `null`
        # (cookie restrito ao host exacto `apiiiv...`, sem wildcard entre
        # subdomínios) para manter a mesma postura da auditoria de segurança
        # de 2026-08-09 (evitar cookie tossing), o SameSite=Lax por omissão
        # do Laravel já cobre pedidos cross-subdomain same-site como este.
        VITE_API_URL: ${VITE_API_URL:-https://apiiiv.noirdataintelligence.com/api}
    image: iiv-minagrif:latest

    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.iiv.rule=Host(`iiv.noirdataintelligence.com`)"
      - "traefik.http.routers.iiv.entrypoints=websecure"
      - "traefik.http.routers.iiv.tls=true"
      - "traefik.http.routers.iiv.tls.certresolver=<CERTRESOLVER>"
      - "traefik.http.services.iiv.loadbalancer.server.port=80"
    restart: unless-stopped
networks:
  proxy:
    external: true