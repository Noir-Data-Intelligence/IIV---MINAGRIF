server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    # Hashed build assets podem ser cacheados de forma agressiva.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Necessario para o MSW (camada mock) registar o service worker na raiz.
    location = /mockServiceWorker.js {
        add_header Service-Worker-Allowed "/";
    }

    # SPA: qualquer rota desconhecida cai para o index.html (React Router).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
