services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SITE_URL: ${VITE_SITE_URL:-https://www.iiv.gov.ao}
        # Backend real (ver Back-end/docker-compose.yml, serviço `nginx`) já
        # existe e está dockerizado — por omissão liga-se a ele, não ao mock.
        VITE_API_MOCK: ${VITE_API_MOCK:-false}
        # Mesmo host, sem subdomínio `api.` próprio (auditoria de segurança,
        # 2026-08-09: um SESSION_DOMAIN com wildcard entre subdomínios
        # permitia cookie tossing a partir de outro subdomínio da agência).
        # O Traefik encaminha /api e /sanctum deste mesmo host para o
        # backend — ver Back-end/docker-compose.yml, labels do serviço `nginx`.
        VITE_API_URL: ${VITE_API_URL:-/api}
    image: iiv-minagrif:latest
    container_name: iiv
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.iiv.rule=Host(`iiv.noirdataintelligence.com`)"
      - "traefik.http.routers.iiv.entrypoints=websecure"
      - "traefik.http.routers.iiv.tls=true"
      - "traefik.http.routers.iiv.tls.certresolver=<CERTRESOLVER>"
      - "traefik.http.services.iiv.loadbalancer.server.port=80"
    restart: unless-stopped
networks:
  proxy:
    external: true